</g><g font-family="Arial, sans-serif">
<text x="24" y="40" font-size="28" fill="#203b32">Your stay: two catalogs, one set of information</text>
<text x="24" y="78" font-size="18" fill="#203b32">Default on a fresh load: By room. The four primary destinations stay unchanged.</text>
<text x="38" y="167" font-size="21" fill="#203b32">By room (default)</text>
<text x="38" y="202" font-size="16" fill="#203b32">Choose Kitchen</text>
<text x="324" y="167" font-size="21" fill="#203b32">Kitchen topics</text>
<text x="324" y="202" font-size="16" fill="#203b32">Open Dishwasher</text>
<text x="610" y="167" font-size="21" fill="#203b32">Dishwasher</text>
<text x="610" y="202" font-size="16" fill="#203b32">Read the shared topic</text>
<text x="896" y="167" font-size="21" fill="#203b32">By category</text>
<text x="896" y="202" font-size="16" fill="#203b32">Same topic stays open</text>
<text x="892" y="263" font-size="15" fill="#203b32">Back to category list</text>
<text x="642" y="309" font-size="22" fill="#203b32">Appliances &amp; entertainment</text>
<text x="642" y="335" font-size="15" fill="#203b32">Dishwasher is the same topic ID in both catalogs.</text>
<text x="42" y="309" font-size="22" fill="#203b32">Switch to By room: restore Kitchen</text>
<text x="42" y="335" font-size="15" fill="#203b32">Switching lists restores the last group used in that view.</text>
<text x="24" y="417" font-size="22" fill="#203b32">While reading a topic</text>
<text x="24" y="452" font-size="18" fill="#203b32">Keep the topic open. Update its room/category breadcrumb. Back returns to that list.</text>
<text x="24" y="499" font-size="22" fill="#203b32">While browsing a list</text>
<text x="24" y="534" font-size="18" fill="#203b32">Restore the other view&#x27;s group, or show its group index the first time.</text>
<text x="24" y="584" font-size="17" fill="#203b32">Whole cottage keeps Wi-Fi, rules and checkout discoverable in the room view.</text>
<text x="24" y="626" font-size="16" fill="#203b32">Remember this session only. A fresh load returns to By room; no sign-in or storage required.</text>
</g></svg>