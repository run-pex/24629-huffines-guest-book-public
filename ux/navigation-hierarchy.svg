<text x="24" y="40" font-size="28" fill="#203b32">Four peer sections; nine content pages</text>
<text x="24" y="75" font-size="18" fill="#203b32">Phone: persistent bottom bar. Desktop: the same four links in the header.</text>
<text x="40" y="156" font-size="24" fill="#203b32">Arrival</text>
<text x="28" y="212" font-size="17" fill="#203b32">Arrival &amp; parking</text>
<text x="325" y="156" font-size="24" fill="#203b32">Your stay</text>
<text x="313" y="212" font-size="17" fill="#203b32">Your stay</text>
<text x="347" y="278" font-size="16" fill="#203b32">Wi-Fi &amp; connection</text>
<text x="347" y="348" font-size="16" fill="#203b32">Hot tub, pond &amp; yard</text>
<text x="347" y="418" font-size="16" fill="#203b32">House rules &amp; dogs</text>
<text x="347" y="488" font-size="16" fill="#203b32">Checkout</text>
<text x="610" y="156" font-size="24" fill="#203b32">Explore</text>
<text x="598" y="212" font-size="17" fill="#203b32">Explore nearby</text>
<text x="632" y="278" font-size="16" fill="#203b32">Local place detail</text>
<text x="895" y="156" font-size="24" fill="#203b32">Help</text>
<text x="883" y="212" font-size="17" fill="#203b32">Help &amp; safety</text>
<text x="24" y="590" font-size="20" fill="#203b32">Your stay is the landing section, not a parent of the other tabs.</text>
<text x="24" y="636" font-size="18" fill="#203b32">Only detail pages have parents. Checkout belongs to Your stay.</text>
<text x="24" y="682" font-size="16" fill="#203b32">Both Help controls preserve a return path. Arrival, Your stay and Explore start new journeys.</text>
</g></svg>